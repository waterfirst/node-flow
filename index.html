function validate(d){if(!d||typeof d.title!=='string'||!['sources','groups','nodes','edges','items'].every(k=>Array.isArray(d[k])))throw Error('title 및 sources/groups/nodes/edges/items 배열이 필요합니다');if(!d.nodes.length)throw Error('노드가 하나 이상 필요합니다');let ids=new Set;for(const n of d.nodes){if(!n.id||ids.has(n.id)||n.id.includes(':'))throw Error('노드 id는 중복 없이 콜론을 제외해야 합니다');ids.add(n.id);if(!d.groups.includes(n.group)||!['AI','코드','사람'].includes(n.kind)||!Array.isArray(n.inputs)||!Array.isArray(n.outputs)||!n.inputs.length||!n.outputs.length||!Number.isFinite(n.duration)||n.duration<0)throw Error(n.id+': 구간·담당·포트·duration을 확인하세요');if(n.pos&&(!Number.isFinite(n.pos.x)||!Number.isFinite(n.pos.y)))throw Error(n.id+': pos 좌표 오류')}for(const e of d.edges){const a=endpoint(e.from),b=endpoint(e.to),na=d.nodes.find(n=>n.id===a[0]),nb=d.nodes.find(n=>n.id===b[0]);if(!na?.outputs.includes(a[1])||!nb?.inputs.includes(b[1]))throw Error('연결 노드 또는 포트가 없습니다: '+e.from+' → '+e.to)}}

function counts(){let count=s=>Object.values(state).filter(x=>x===s).length;$('#stats').innerHTML=[['노드',data.nodes.length],['작업',mode==='demo'?'-':data.items.length],['통과',mode==='demo'?'-':count('pass')+count('fixed')],['실패',mode==='demo'?'-':count('fail')],['고침',mode==='demo'?'-':count('fixed')]].map(([l,n])=>`<span><strong>${n}</strong>${l}</span>`).join('')}

function bez(a,b){let d=Math.max(40,Math.abs(b.x-a.x)*.5),pts=[],cum=[0],len=0;for(let i=0;i<=80;i++){let t=i/80,u=1-t,p={x:u*u*u*a.x+3*u*u*t*(a.x+d)+3*u*t*t*(b.x-d)+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*a.y+3*u*t*t*b.y+t*t*t*b.y};if(i)len+=Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y);pts.push(p);cum[i]=len}return{pts,cum,len,path:`M${a.x},${a.y} C${a.x+d},${a.y} ${b.x-d},${b.y} ${b.x},${b.y}`}}
function render(){const topo=topology();$('#title').textContent=data.title;$('#warning').textContent=topo.cyclic.length?'순환 또는 순환에 종속된 노드가 있습니다. 연결을 수정하세요.':'';const sorted=[...data.groups].sort((a,b)=>avg(a)-avg(b));function avg(g){const ns=data.nodes.filter(n=>n.group===g);return ns.reduce((v,n)=>v+(topo.depth[n.id]||0),0)/(ns.length||1)}let html='',maxY=400;
sorted.forEach((g,i)=>{let ns=data.nodes.filter(n=>n.group===g).sort((a,b)=>(topo.depth[a.id]||0)-(topo.depth[b.id]||0)),x=460+i*304,y=130+(i%2?40:0),c=colors[i%6];html+=`<div class="group" style="left:${x-16}px;top:${y-44}px;width:280px;height:${ns.length*152+60}px;--c:${c}">${esc(g)} <span class="muted">${ns.length}노드</span></div>`;ns.forEach((n,j)=>{n._x=n.pos?.x??x;n._y=n.pos?.y??y+j*152;n._c=c;maxY=Math.max(maxY,n._y+180);html+=`<article class="node ${state[n.id]||''}" data-id="${esc(n.id)}" style="left:${n._x}px;top:${n._y}px;--c:${c}"><h3><span style="color:${c}">▪</span>${esc(n.name)}<span class="kind">${n.kind}</span></h3><span class="pill">${esc(n.model)}</span><span class="state">${statusNames[state[n.id]]||'대기'}</span><p>${esc(state[n.id]==='fail'?n.failReason:n.role)}</p>${state[n.id]==='fail'?'<button class="fix">고치기 · 시연</button>':''}${n.inputs.map((p,k)=>`<i class="port in" style="top:${62+k*14}px"><span>${esc(p)}</span></i>`).join('')}${n.outputs.map((p,k)=>`<i class="port out" style="top:${62+k*14}px"><span>${esc(p)}</span></i>`).join('')}</article>`})});W=Math.max(460+sorted.length*304+650,...data.nodes.map(n=>n._x+300));H=maxY+100;let rx=W-190;
data.sources.forEach((s,i)=>html+=`<div class="source" id="source${i}" style="left:24px;top:${180+i*70}px;width:180px">${esc(s)}</div>`);html+='<div class="hub" id="hub" style="left:280px;top:210px">회로 연결<small>입력 합류</small></div>';data.items.forEach((s,i)=>html+=`<div class="chip" id="item${i}" style="left:${W-580+(i%3)*115}px;top:${200+Math.floor(i/3)*50}px">${esc(s)}</div>`);html+=`<div class="result" id="result" style="left:${rx}px;top:210px">완료<small id="done">- / -</small><small>${esc(data.result)}</small></div>`;$('#objects').innerHTML=html;$('#world').style.width=W+'px';$('#world').style.height=H+'px';links=[];
function add(from,to,a,b,color='#8e76f1',cyclic=false){links.push({from,to,...bez(a,b),color,cyclic,start:Infinity})}
data.sources.forEach((s,i)=>add('source'+i,'hub',{x:204,y:200+i*70},{x:280,y:260}));let roots=data.nodes.filter(n=>!data.edges.some(e=>endpoint(e.to)[0]===n.id)),leaves=data.nodes.filter(n=>!data.edges.some(e=>endpoint(e.from)[0]===n.id));roots.forEach(n=>add('hub',n.id,{x:380,y:260},{x:n._x,y:n._y+66},n._c));data.edges.forEach(e=>{let [a,p]=endpoint(e.from),[b,q]=endpoint(e.to),na=data.nodes.find(n=>n.id===a),nb=data.nodes.find(n=>n.id===b);add(a,b,{x:na._x+248,y:na._y+66+na.outputs.indexOf(p)*14},{x:nb._x,y:nb._y+66+nb.inputs.indexOf(q)*14},na._c,topo.cyclic.includes(a)&&topo.cyclic.includes(b))});leaves.forEach(n=>{if(data.items.length)data.items.forEach((s,i)=>add(n.id,'item'+i,{x:n._x+248,y:n._y+66},{x:W-580+(i%3)*115,y:220+Math.floor(i/3)*50},'#6fe27f'));else add(n.id,'result',{x:n._x+248,y:n._y+66},{x:rx,y:280},'#6fe27f')});data.items.forEach((s,i)=>add('item'+i,'result',{x:W-475+(i%3)*115,y:220+Math.floor(i/3)*50},{x:rx,y:280},'#6fe27f'));
$('#wires').setAttribute('width',W);$('#wires').setAttribute('height',H);$('#wires').innerHTML=links.map(l=>`<path d="${l.path}" fill="none" stroke="${l.cyclic?'#f2566f':'#2f3146'}" stroke-width="1.2" ${l.cyclic?'stroke-dasharray="6 5"':''}/>`).join('');$('#light').width=W;$('#light').height=H;scheduleDemo();counts();transform();save()}
function flight(l){return Math.min(.95,Math.max(.38,l.len/760))}let demoEnd=0;
function scheduleDemo(){let arrive={};links.forEach(l=>l.demo=Infinity);for(let i=0;i<links.length+2;i++)for(const l of links){if(l.cyclic)continue;let ins=links.filter(e=>e.to===l.from);let ready=l.from.startsWith('source')?Number(l.from.slice(6))*.14:ins.length&&ins.every(e=>Number.isFinite(e.demo))?Math.max(...ins.map(e=>e.demo+flight(e)))+.06:Infinity;l.demo=ready+(l.to.startsWith('item')?Number(l.to.slice(4))*.07:0)}demoEnd=Math.max(0,...links.filter(l=>Number.isFinite(l.demo)).map(l=>l.demo+flight(l)))+2.4}

function setState(id,s,msg){state[id]=s;const el=[...document.querySelectorAll('.node')].find(e=>e.dataset.id===id);if(el){el.className='node '+s;el.querySelector('.state').textContent=statusNames[s];let n=data.nodes.find(n=>n.id===id);el.querySelector('p').textContent=s==='fail'?n.failReason:n.role;el.querySelector('.fix')?.remove();if(s==='fail'){let b=document.createElement('button');b.className='fix';b.textContent='고치기 · 시연';el.append(b)}}counts();flash(id);log(id,msg||statusNames[s])}

let finishedAt=null;function finish(t){if(finishedAt!==null)return;finishedAt=t;let pass=Object.values(state).filter(s=>s==='pass'||s==='fixed').length,fail=Object.values(state).filter(s=>s==='fail').length,blocked=Object.values(state).filter(s=>s==='blocked').length;runs.unshift({at:new Date().toLocaleString('ko-KR'),pass,fail,blocked});log('완료',`시연 · 통과 ${pass} / 실패 ${fail} / 막힘 ${blocked}`)}
function block(id){for(const l of links.filter(l=>l.from===id)){if(state[l.to]==='waiting'){setState(l.to,'blocked');block(l.to)}}}
function fix(id){if(mode!=='run'&&mode!=='idle')return;mode='run';finishedAt=null;setState(id,'fixed','고침 · 시연상의 통과 처리');for(const n of data.nodes)if(state[n.id]==='blocked')state[n.id]='waiting';for(const n of data.nodes)if(state[n.id]==='waiting'){let ins=links.filter(l=>l.to===n.id);if(ins.some(l=>state[l.from]==='fail'||state[l.from]==='blocked'))block(ins.find(l=>state[l.from]==='fail'||state[l.from]==='blocked').from)}for(const n of data.nodes)if(state[n.id]==='waiting'){const el=[...document.querySelectorAll('.node')].find(e=>e.dataset.id===n.id);el.className='node';el.querySelector('.state').textContent='대기'}emit(id,(performance.now()-epoch)/1000);counts()}
function trace(ctx,l,end,tail=0){let p=l.pts;ctx.beginPath();let first=true;for(let i=0;i<p.length;i++)if(l.cum[i]>=tail&&l.cum[i]<=end){if(first){ctx.moveTo(p[i].x,p[i].y);first=false}else ctx.lineTo(p[i].x,p[i].y)}}
const reduced=matchMedia('(prefers-reduced-motion: reduce)');function tick(now){let t=(now-epoch)/1000,ctx=$('#light').getContext('2d');ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';if(mode==='run'){for(const e of [...events])if(t>=e.at){events.splice(events.indexOf(e),1);let n=data.nodes.find(n=>n.id===e.id);setState(n.id,n.fail?'fail':'pass');if(n.fail)block(n.id);else emit(n.id,t)}for(const l of links)if(!l.arrived&&t>=l.start+flight(l)){l.arrived=true;arrive(l.to,t)}if(finishedAt===null&&data.nodes.every(n=>['pass','fail','fixed','blocked'].includes(state[n.id]))&&Object.values(state).includes('fail'))finish(t);if(finishedAt!==null&&repeat&&t>finishedAt+2.4){finishedAt=null;run()}}
for(const l of links){if(l.cyclic)continue;let start=mode==='demo'?l.demo:l.start,u=(mode==='demo'?t%demoEnd:t)-start,d=flight(l);if(u<0||!Number.isFinite(u))continue;let f=Math.min(1,u/d),ease=f<.5?2*f*f:1-(-2*f+2)**2/2,end=l.len*ease,alpha=f===1?.16+.84*Math.exp(-(u-d)/1.9):.9;if(reduced.matches){end=l.len;alpha=.3}ctx.strokeStyle=l.color;ctx.globalAlpha=alpha*.22;ctx.lineWidth=6;trace(ctx,l,end);ctx.stroke();ctx.globalAlpha=alpha;ctx.lineWidth=1.6;trace(ctx,l,end);ctx.stroke();if(f<1&&!reduced.matches){ctx.lineWidth=3;trace(ctx,l,end,Math.max(0,end-120));ctx.stroke();let p=l.pts[Math.min(80,Math.round(ease*80))];ctx.fillStyle='#f4f3fa';ctx.shadowColor=l.color;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}if(mode==='demo'){let key=Math.floor(t/demoEnd);if(u>=d&&l.fl!==key){l.fl=key;flash(l.to)}}}ctx.globalAlpha=1;requestAnimationFrame(tick)}
function transform(){$('#world').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;document.querySelectorAll('.node p').forEach(el=>el.style.fontSize=(11*Math.max(1,.62/scale))+'px');mini()}
function fit(){let v=$('#viewport');scale=Math.max(.4,Math.min(1.6,(v.clientWidth-60)/W,(v.clientHeight-130)/H));tx=(v.clientWidth-W*scale)/2;ty=(v.clientHeight-H*scale)/2;transform()}
function zoom(f,x=$('#viewport').clientWidth/2,y=$('#viewport').clientHeight/2){let s=Math.max(.4,Math.min(1.6,scale*f));tx=x-(x-tx)*s/scale;ty=y-(y-ty)*s/scale;scale=s;transform()}
function mini(){let c=$('#mini'),ctx=c.getContext('2d');ctx.clearRect(0,0,280,140);let s=Math.min(280/W,140/H);ctx.fillStyle='#948ceb';data.nodes.forEach(n=>ctx.fillRect(n._x*s,n._y*s,248*s,116*s));ctx.strokeStyle='#f4f3fa';ctx.strokeRect(-tx/scale*s,-ty/scale*s,$('#viewport').clientWidth/scale*s,$('#viewport').clientHeight/scale*s)}
function locate(id){let n=data.nodes.find(n=>n.id===id);if(n){tx=$('#viewport').clientWidth/2-(n._x+124)*scale;ty=$('#viewport').clientHeight/2-(n._y+60)*scale;transform();openNode(id)}}
function openNode(id){selected=id;let n=data.nodes.find(n=>n.id===id),d=$('#drawer');d.classList.add('open');d.innerHTML=`<div class="row"><h2>노드 정보</h2><div class="grow"></div><button id="close">✕</button></div>${['name','model','role','duration','failReason','inputs','outputs'].map((k,i)=>`<label>${['이름','모델 / 실행 코드','하는 일','시연 시간 (초)','실패 사유','입력 포트 (쉼표 구분)','출력 포트 (쉼표 구분)'][i]}</label><input data-field="${k}" value="${esc(Array.isArray(n[k])?n[k].join(','):n[k])}">`).join('')}<label>담당</label><select data-field="kind">${['AI','코드','사람'].map(k=>`<option ${k===n.kind?'selected':''}>${k}</option>`).join('')}</select><label><input id="failcheck" type="checkbox" ${n.fail?'checked':''} style="width:auto"> 실패 시연</label><h3>연결</h3><div id="connections"></div><select id="target">${data.nodes.filter(x=>x.id!==id).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><button id="connect">출력 → 선택 노드 입력 연결</button><h3>기록</h3><div>${history.filter(h=>h.node===id).slice(0,20).map(h=>esc(h.at+' '+h.msg)).join('<br>')||'기록 없음'}</div><p class="muted">모든 편집은 자동 저장됩니다. 모델 이름은 호출 설정이 아닌 표시 정보입니다.</p>`;$('#close').onclick=()=>d.classList.remove('open');d.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{let k=el.dataset.field,v=k==='duration'?Number(el.value):['inputs','outputs'].includes(k)?el.value.split(',').map(v=>v.trim()).filter(Boolean):el.value;let copy=structuredClone(data);copy.nodes.find(x=>x.id===id)[k]=v;try{validate(copy);data=copy;resetEdit()}catch(e){alert(e.message);openNode(id)}});$('#failcheck').onchange=e=>{n.fail=e.target.checked;save()};$('#connect').onclick=()=>{let target=data.nodes.find(x=>x.id===$('#target').value);if(!target)return;let edge={from:id+':'+n.outputs[0],to:target.id+':'+target.inputs[0]};if(!data.edges.some(e=>e.from===edge.from&&e.to===edge.to))data.edges.push(edge);resetEdit();openNode(id)};$('#connections').innerHTML=data.edges.map((e,i)=>({e,i})).filter(({e})=>endpoint(e.from)[0]===id||endpoint(e.to)[0]===id).map(({e,i})=>`<p><button data-jump="${esc(endpoint(e.from)[0]===id?endpoint(e.to)[0]:endpoint(e.from)[0])}">${esc(e.from+' → '+e.to)}</button> <button data-remove="${i}">×</button></p>`).join('');d.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>locate(b.dataset.jump));d.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{data.edges.splice(Number(b.dataset.remove),1);resetEdit();openNode(id)})}
function resetEdit(){mode='demo';state={};events=[];finishedAt=null;epoch=performance.now();render()}
function tab(name){$('#panel').classList.toggle('open',name!=='graph');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='graph')return;let p=$('#panel');if(name==='nodes'){p.innerHTML='<h2>노드</h2><table><thead><tr><th>이름</th><th>담당</th><th>모델 / 코드</th><th>상태</th></tr></thead><tbody>'+data.nodes.map(n=>`<tr data-node="${esc(n.id)}"><td>${esc(n.name)}</td><td>${n.kind}</td><td>${esc(n.model)}</td><td>${statusNames[state[n.id]]||'대기'}</td></tr>`).join('')+'</tbody></table>';p.querySelectorAll('[data-node]').forEach(r=>r.onclick=()=>openNode(r.dataset.node))}if(name==='runs')p.innerHTML='<h2>시연 실행 기록</h2>'+ (runs.map(r=>`<p>${esc(r.at)} · 통과 ${r.pass} · 실패 ${r.fail} · 막힘 ${r.blocked}</p>`).join('')||'실행 기록 없음');if(name==='json'){p.innerHTML='<div class="row"><h2>그래프 JSON</h2><button id="apply">적용</button><button id="export">내보내기</button><button id="download">HTML 저장</button><label style="margin:0">불러오기 <input id="import" type="file" accept=".json"></label></div><p id="error" class="reason"></p><textarea id="json" spellcheck="false"></textarea>';$('#json').value=JSON.stringify(cleanData(),null,2);$('#apply').onclick=()=>{try{let d=JSON.parse($('#json').value);validate(d);data=d;resetEdit();fit();$('#error').textContent='적용 완료'}catch(e){let pos=Number((e.message.match(/position (\d+)/)||[])[1]||0),line=$('#json').value.slice(0,pos).split('\n').length;$('#error').textContent=`${line}행 (구조 오류는 해당 필드 확인): ${e.message}`}};$('#export').onclick=()=>download('oled-flow.json',JSON.stringify(cleanData(),null,2),'application/json');$('#download').onclick=()=>{let h='<!doctype html>'+document.documentElement.outerHTML;h=h.replace(/let data=structuredClone\(initial\)/,'let data='+JSON.stringify(cleanData()).replace(/</g,'\\u003c'));download('oled-node-viewer.html',h,'text/html')};$('#import').onchange=async e=>{let f=e.target.files[0];if(f)$('#json').value=await f.text()}}}
function cleanData(){return JSON.parse(JSON.stringify(data,(k,v)=>k.startsWith('_')?undefined:v))}function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('#run').onclick=()=>{finishedAt=null;run()};$('#stop').onclick=()=>{mode='idle';log('정지','시연 정지')};$('#repeat').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('active',repeat)};$('#fit').onclick=fit;$('#plus').onclick=()=>zoom(1.2);$('#minus').onclick=()=>zoom(1/1.2);
let v=$('#viewport');v.onwheel=e=>{e.preventDefault();let r=v.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.001),e.clientX-r.left,e.clientY-r.top)};
v.onpointerdown=e=>{if(e.target.closest('#navigation'))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});v.setPointerCapture(e.pointerId);if(pointers.size===2){let a=[...pointers.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);drag=null;return}let el=e.target.closest('.node'),n=el&&data.nodes.find(n=>n.id===el.dataset.id);drag={sx:e.clientX,sy:e.clientY,tx,ty,n:n&&e.target.closest('h3')?n:null,click:n,id:n?.id,x:n?._x,y:n?._y,fix:!!e.target.closest('.fix')}};
v.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=v.getBoundingClientRect();zoom(d/pinch,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top);pinch=d;return}if(!drag)return;let dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(drag.n){drag.n.pos={x:Math.max(0,drag.x+dx/scale),y:Math.max(0,drag.y+dy/scale)};let old=links.map(l=>({from:l.from,to:l.to,start:l.start,arrived:l.arrived}));render();links.forEach(l=>Object.assign(l,old.find(o=>o.from===l.from&&o.to===l.to)||{}))}else if(!drag.click){tx=drag.tx+dx;ty=drag.ty+dy;transform()}};
v.onpointerup=e=>{pointers.delete(e.pointerId);if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4&&drag.click){if(drag.fix)fix(drag.id);else openNode(drag.id)}drag=null;pinch=null;save()};v.onpointercancel=()=>{drag=null;pointers.clear()};v.ondblclick=e=>{if(e.target.closest('.node,#navigation'))return;let name=prompt('새 노드 이름');if(name)addNode(name)};
function addNode(name){data.nodes.push({id:'n'+Date.now(),name,group:data.groups[0],kind:'코드',model:'',role:'',inputs:['입력'],outputs:['출력'],duration:1,fail:false,failReason:'',pos:null});resetEdit();fit()}
let md=false;function miniMove(e){let r=$('#mini').getBoundingClientRect(),s=Math.min(280/W,140/H),x=(e.clientX-r.left)*280/r.width/s,y=(e.clientY-r.top)*140/r.height/s;tx=v.clientWidth/2-x*scale;ty=v.clientHeight/2-y*scale;transform()}$('#mini').onpointerdown=e=>{md=true;$('#mini').setPointerCapture(e.pointerId);miniMove(e)};$('#mini').onpointermove=e=>{if(md)miniMove(e)};$('#mini').onpointerup=()=>md=false;
document.onkeydown=e=>{if(e.key==='Escape'){$('#drawer').classList.remove('open');tab('graph')}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key.toLowerCase()==='f')fit();if(e.key.toLowerCase()==='r'){finishedAt=null;run()}if(e.key.toLowerCase()==='g')$('#world').classList.toggle('simple')};window.onresize=fit;
$('#command').onkeydown=e=>{if(e.key!=='Enter')return;let s=e.target.value.trim();if(s.startsWith('추가 '))addNode(s.slice(3));else if(s.startsWith('삭제 ')){let n=data.nodes.find(n=>n.name===s.slice(3));if(n&&data.nodes.length>1){data.nodes=data.nodes.filter(x=>x!==n);data.edges=data.edges.filter(e=>! [endpoint(e.from)[0],endpoint(e.to)[0]].includes(n.id));resetEdit()}}else if(s.startsWith('이름 ')&&s.includes('→')){let [a,b]=s.slice(3).split('→').map(s=>s.trim()),n=data.nodes.find(n=>n.name===a);if(n&&b){n.name=b;resetEdit()}}else log('편집','명령: 추가 이름 / 삭제 이름 / 이름 기존 → 변경');e.target.value=''};
let poll=null,seen=new Set;$('#live').onchange=async e=>{clearInterval(poll);if(!e.target.checked)return;if(location.protocol==='file:'){$('#warning').textContent='실시간 연결: python3 -m http.server 로 열어 주세요';e.target.checked=false;return}async function read(){try{let r=await fetch('./status.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let text=await r.text(),rows;try{rows=JSON.parse(text)}catch{rows=text.trim().split('\n').map(s=>JSON.parse(s))}if(!Array.isArray(rows))throw Error('상태 목록이 필요합니다');mode='live';for(const row of rows){let key=JSON.stringify(row);if(seen.has(key))continue;if(!data.nodes.some(n=>n.id===row.node)||!['running','pass','fail','fixed'].includes(row.status))continue;seen.add(key);setState(row.node,row.status,row.msg);if(row.status==='pass'||row.status==='fixed')emit(row.node,(performance.now()-epoch)/1000)}$('#warning').textContent='실시간 상태 연결 · 파일의 변경 이벤트 표시'}catch(err){$('#warning').textContent='status.json 읽기 실패: '+err.message}}await read();poll=setInterval(read,2000)};
render();fit();tab('graph');log('OLED','예시 흐름 · 실제 숫자 아님');requestAnimationFrame(tick);
</script></html>
